---
name: Bug report
description: 报告一个缺陷 / Report a bug
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题！请尽量提供可复现信息。
  - type: input
    id: version
    attributes:
      label: 插件 / DSH 版本
      description: dsh-plugin-manager 版本与 dsh 版本（`dsh --version`）
      placeholder: "dsh-plugin-manager 0.1.0 / dsh 0.1.0-rc.7"
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: 问题描述
      description: 发生了什么？期望行为是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 安装/停用某个插件……
        2. 重启 DSH……
        3. 观察……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 浏览器 Console、Network、`/tppm/debug` 输出、`~/.dsh/cordis.patch.yml` 等
  - type: textarea
    id: env
    attributes:
      label: 运行环境
      description: OS、Node 版本、profile 名等
